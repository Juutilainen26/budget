<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>통합 가계부</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1f2430; --sub:#6b7280; --line:#e6e8ec;
  --brand:#4f46e5; --brand2:#6366f1; --exp:#e5484d; --inc:#12805c; --tr:#2563eb;
  --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.app{max-width:520px;margin:0 auto;min-height:100vh}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between}
header.top h1{font-size:18px;margin:0;font-weight:700}
.month-nav{display:flex;align-items:center;gap:8px}
.month-nav button{border:none;background:var(--card);box-shadow:var(--shadow);width:32px;height:32px;border-radius:10px;font-size:16px;color:var(--ink)}
.month-nav .m{font-weight:700;font-size:15px;min-width:78px;text-align:center}
.view{padding:8px 16px 24px}
.hidden{display:none!important}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.total{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.total .lbl{font-size:13px;opacity:.9}
.total .amt{font-size:30px;font-weight:800;margin-top:2px;letter-spacing:-.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mini{background:rgba(255,255,255,.16);border-radius:12px;padding:10px 12px}
.mini .l{font-size:12px;opacity:.9}.mini .v{font-size:17px;font-weight:700;margin-top:2px}
.sec-title{font-size:13px;color:var(--sub);font-weight:700;margin:16px 4px 8px}
.acc{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:none}
.acc .nm{font-size:15px;font-weight:600}
.acc .bk{font-size:12px;color:var(--sub);margin-top:1px}
.acc .bal{font-size:15px;font-weight:700}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:#eef0ff;color:var(--brand);margin-left:6px;vertical-align:middle}
.tag.card{background:#fdecec;color:var(--exp)}
.neg{color:var(--exp)}
.tx{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:none}
.tx .li{font-size:15px;font-weight:600}
.tx .sub{font-size:12px;color:var(--sub);margin-top:2px}
.tx .amt{font-size:15px;font-weight:700;white-space:nowrap}
.a-exp{color:var(--exp)}.a-inc{color:var(--inc)}.a-tr{color:var(--tr)}
.daygroup{margin-bottom:6px}
.dayhead{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);padding:10px 4px 2px;font-weight:700}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
.bud{padding:12px 4px;border-bottom:1px solid var(--line)}
.bud:last-child{border-bottom:none}
.bud .top{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.bar{height:8px;background:var(--line);border-radius:999px;margin-top:8px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand);border-radius:999px}
.bud .info{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}
.over > i{background:var(--exp)}
.over .pct{color:var(--exp);font-weight:700}
.set-item{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--line);font-size:15px}
.set-item:last-child{border-bottom:none}
.set-item .r{color:var(--sub);font-size:13px}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;background:var(--brand);color:#fff}
.btn.sec{background:#eef0ff;color:var(--brand)}
.btn.ghost{background:transparent;color:var(--sub);font-weight:600}
.btn.danger{background:#fdecec;color:var(--exp)}
.btn+.btn{margin-top:8px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;
  width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;border:none;font-size:30px;box-shadow:0 6px 16px rgba(79,70,229,.45)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);
  display:flex;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:none;background:none;padding:10px 0 8px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--brand);font-weight:700}
/* modal */
.sheet-bg{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;
  padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:6px 0 12px;font-size:17px;text-align:center}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:none;background:none;padding:9px;border-radius:9px;font-size:14px;font-weight:700;color:var(--sub)}
.seg button.on{background:#fff;box-shadow:var(--shadow)}
.seg button.on[data-t="지출"]{color:var(--exp)}
.seg button.on[data-t="수입"]{color:var(--inc)}
.seg button.on[data-t="이체"]{color:var(--tr)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
.fld input.amt-in{font-size:24px;font-weight:800;text-align:right;letter-spacing:-.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mut{font-size:11px;color:var(--sub);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.close{position:absolute;right:16px;top:16px;border:none;background:none;font-size:22px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:#1f2430;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s}
.toast.show{opacity:.95}
canvas{max-width:100%}
.legend{margin-top:12px}
.legend .li{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:6px 2px;border-bottom:1px solid var(--line)}
.legend .li:last-child{border-bottom:none}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:8px}
.link{color:var(--brand);font-weight:600}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;margin-bottom:10px}
.searchbar .si{font-size:15px;color:var(--sub)}
.searchbar input{flex:1;border:none;background:transparent;font-size:15px;color:var(--ink);outline:none;font-family:inherit}
.searchbar button{border:none;background:var(--line);color:var(--sub);width:22px;height:22px;border-radius:50%;font-size:12px;flex:none}
#searchSummary{font-size:12px;color:var(--brand);font-weight:700;margin:0 4px 8px;display:none}
.period{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;margin-bottom:10px}
.period .chips{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
.period .two{margin-top:8px}
.period .two input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;font-size:14px;color:var(--ink);background:#fff;font-family:inherit}
.ordbtn{border:1px solid var(--line);background:#fff;color:var(--sub);width:28px;height:22px;border-radius:6px;font-size:10px;line-height:1;padding:0}
.ordbtn:disabled{opacity:.3}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 id="topTitle">가계부</h1>
    <div class="month-nav" id="monthNav">
      <button onclick="shiftMonth(-1)">‹</button>
      <span class="m" id="mLabel"></span>
      <button onclick="shiftMonth(1)">›</button>
    </div>
  </header>

  <!-- 홈 -->
  <section class="view" id="v-home">
    <div class="card total">
      <div class="lbl">총 자산 (순자산)</div>
      <div class="amt" id="totalAssets">₩0</div>
      <div class="row2">
        <div class="mini"><div class="l">이번달 수입</div><div class="v" id="mInc">₩0</div></div>
        <div class="mini"><div class="l">이번달 지출</div><div class="v" id="mExp">₩0</div></div>
      </div>
    </div>
    <div id="cardStatus"></div>
    <div class="sec-title">계좌별 잔액</div>
    <div class="card" id="accList"></div>
  </section>

  <!-- 내역 -->
  <section class="view hidden" id="v-list">
    <div class="searchbar">
      <span class="si">🔍</span>
      <input id="searchBox" placeholder="내용·카테고리·금액 검색" oninput="onSearch(this.value)" autocomplete="off">
      <button id="searchClear" onclick="clearSearch()" style="display:none">✕</button>
    </div>
    <div class="period">
      <div class="chips" id="periodChips">
        <button class="chip on" data-p="all" onclick="setPeriod('all')">전체</button>
        <button class="chip" data-p="1m" onclick="setPeriod('1m')">1개월</button>
        <button class="chip" data-p="3m" onclick="setPeriod('3m')">3개월</button>
        <button class="chip" data-p="6m" onclick="setPeriod('6m')">6개월</button>
        <button class="chip" data-p="year" onclick="setPeriod('year')">올해</button>
      </div>
      <div class="two">
        <input type="date" id="fromDate" onchange="onDateInput()" aria-label="시작일">
        <input type="date" id="toDate" onchange="onDateInput()" aria-label="종료일">
      </div>
    </div>
    <div id="searchSummary"></div>
    <div class="card"><div id="listBody"></div></div>
  </section>

  <!-- 통계 -->
  <section class="view hidden" id="v-stat">
    <div class="card">
      <div class="sec-title" style="margin-top:0">이번달 지출 구성</div>
      <canvas id="pie" height="220"></canvas>
      <div class="legend" id="pieLegend"></div>
    </div>
    <div class="card">
      <div class="sec-title" style="margin-top:0">최근 6개월 수입·지출</div>
      <canvas id="bars" height="200"></canvas>
    </div>
  </section>

  <!-- 예산 -->
  <section class="view hidden" id="v-budget">
    <div class="card"><div id="budgetBody"></div></div>
    <button class="btn sec" onclick="openBudgetEdit()">예산 설정하기</button>
  </section>

  <!-- 설정 -->
  <section class="view hidden" id="v-set">
    <div class="sec-title" style="margin-top:0">계좌 · 카테고리</div>
    <div class="card">
      <div class="set-item" onclick="openManageAcc()"><span>계좌 관리</span><span class="r" id="accCount">›</span></div>
      <div class="set-item" onclick="openManageCat()"><span>카테고리 관리</span><span class="r">›</span></div>
    </div>
    <div class="sec-title">백업 · 내보내기</div>
    <div class="card">
      <div class="set-item" onclick="exportXlsx()"><span>엑셀(xlsx)로 내보내기</span><span class="r">›</span></div>
      <div class="set-item" onclick="document.getElementById('impXlsx').click()"><span>엑셀에서 거래 가져오기</span><span class="r">›</span></div>
      <div class="set-item" onclick="exportJson()"><span>전체 백업 (JSON)</span><span class="r">›</span></div>
      <div class="set-item" onclick="document.getElementById('impJson').click()"><span>백업 복원 (JSON)</span><span class="r">›</span></div>
    </div>
    <div class="sec-title">기타</div>
    <div class="card">
      <div class="set-item" onclick="wipeExamples()"><span>예시 거래 지우기</span><span class="r">›</span></div>
      <div class="set-item" onclick="resetAll()"><span class="neg">전체 초기화</span><span class="r">›</span></div>
    </div>
    <p class="mut" style="text-align:center;margin-top:16px">데이터는 이 기기의 브라우저에 저장됩니다. 기기를 바꾸거나 백업하려면 위 내보내기를 사용하세요.</p>
    <input type="file" id="impXlsx" accept=".xlsx,.xls" onchange="importXlsx(this.files[0])">
    <input type="file" id="impJson" accept=".json" onchange="importJson(this.files[0])">
  </section>
</div>

<button class="fab" id="fab" onclick="openTx()">＋</button>

<nav class="tabs" id="tabs">
  <button class="on" data-v="home" onclick="go('home')"><span class="ic">🏠</span>홈</button>
  <button data-v="list" onclick="go('list')"><span class="ic">📒</span>내역</button>
  <button data-v="stat" onclick="go('stat')"><span class="ic">📊</span>통계</button>
  <button data-v="budget" onclick="go('budget')"><span class="ic">🎯</span>예산</button>
  <button data-v="set" onclick="go('set')"><span class="ic">⚙️</span>설정</button>
</nav>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- 데이터 ---------- */
const DB_KEY='gagyebu_v1';
let db;
function seed(){
  const A=(name,bank,type,extra={})=>Object.assign({id:uid(),name,bank,type,initial:0,currency:'KRW',payDay:null,sort:0},extra);
  const accounts=[
    A('입출금 통장','은행','입출금'),
    A('신용카드','카드','신용카드',{payDay:14}),
    A('현금','현금','현금'),
  ];
  accounts.forEach((a,i)=>a.sort=i);
  const C=(name,kind)=>({id:uid(),name,kind,budget:0,sort:0});
  const cats=[
    C('식비','지출'),C('카페/간식','지출'),C('생활용품','지출'),C('주거/통신','지출'),
    C('교통/차량','지출'),C('문화/여가','지출'),C('쇼핑/미용','지출'),C('의료/건강','지출'),
    C('교육/자기계발','지출'),C('경조사/회비','지출'),C('세금/보험/수수료','지출'),
    C('저축/투자','지출'),C('기타지출','지출'),
    C('급여','수입'),C('용돈','수입'),C('금융수입(이자/배당)','수입'),C('기타수입','수입'),
    C('카드대금 상환','이체'),C('계좌이체','이체'),
  ];
  cats.forEach((c,i)=>c.sort=i);
  const bankId=accounts[0].id, cardId=accounts[1].id, cashId=accounts[2].id;
  const salaryC=cats.find(c=>c.name==='급여').id, foodC=cats.find(c=>c.name==='식비').id,
        trC=cats.find(c=>c.name==='계좌이체').id, shopC=cats.find(c=>c.name==='쇼핑/미용').id;
  const t=(o)=>Object.assign({id:uid(),fx:'',inst:'',memo:'',from:null,to:null,cat:null},o);
  const transactions=[
    t({date:iso(-4),type:'수입',amount:3000000,to:bankId,cat:salaryC,memo:'[예시] 급여'}),
    t({date:iso(0),type:'지출',amount:15000,from:bankId,cat:foodC,memo:'[예시] 점심 식사'}),
    t({date:iso(0),type:'이체',amount:100000,from:bankId,to:cashId,cat:trC,memo:'[예시] 현금 인출'}),
    t({date:iso(-1),type:'지출',amount:30000,from:cardId,cat:shopC,fx:'$22 (USD)',memo:'[예시] 해외직구 카드결제'}),
  ];
  db={accounts,categories:cats,transactions,settings:{}};
}
function uid(){return Math.random().toString(36).slice(2,9)}
function iso(offset){const d=new Date();d.setDate(d.getDate()+offset);return d.toISOString().slice(0,10)}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`}
function load(){try{const r=localStorage.getItem(DB_KEY);if(r){db=JSON.parse(r);ensureOrd();return}}catch(e){}seed();ensureOrd();save()}
function save(){localStorage.setItem(DB_KEY,JSON.stringify(db))}
function ensureOrd(){
  if(!db.transactions.some(t=>t.ord==null))return;
  const sorted=db.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
  sorted.forEach((t,i)=>t.ord=i+1);
  save();
}
function nextOrd(){return db.transactions.reduce((m,t)=>Math.max(m,t.ord||0),0)+1}

/* ---------- 계산 ---------- */
const acc=id=>db.accounts.find(a=>a.id===id);
const cat=id=>db.categories.find(c=>c.id===id);
function accBalance(id){let b=acc(id).initial||0;for(const t of db.transactions){if(t.to===id)b+=t.amount;if(t.from===id)b-=t.amount;}return b}
function totalAssets(){return db.accounts.reduce((s,a)=>s+accBalance(a.id),0)}
function ymOf(d){return d.slice(0,7)}
function curYM(){return selMonth}
function addMonth(ym,n){const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthTx(ym){return db.transactions.filter(t=>ymOf(t.date)===ym)}
function sumType(ym,type){return monthTx(ym).filter(t=>t.type===type).reduce((s,t)=>s+t.amount,0)}
function cardUsage(cardId,ym){return db.transactions.filter(t=>t.type==='지출'&&t.from===cardId&&ymOf(t.date)===ym).reduce((s,t)=>s+t.amount,0)}
const won=n=>'₩'+Math.round(n).toLocaleString('ko-KR');
const wonS=n=>(n<0?'-':'')+'₩'+Math.abs(Math.round(n)).toLocaleString('ko-KR');

/* ---------- 상태 ---------- */
let selMonth=(()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')})();
let curView='home';
let searchQuery='';
let searchFrom='';
let searchTo='';
let reorderMode=false;

function go(v){curView=v;
  document.querySelectorAll('.view').forEach(s=>s.classList.add('hidden'));
  document.getElementById('v-'+v).classList.remove('hidden');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const titles={home:'가계부',list:'거래 내역',stat:'통계',budget:'예산',set:'설정'};
  document.getElementById('topTitle').textContent=titles[v];
  document.getElementById('monthNav').style.visibility=(v==='set')?'hidden':'visible';
  render();
}
function shiftMonth(n){selMonth=addMonth(selMonth,n);render()}

/* ---------- 렌더 ---------- */
function render(){
  document.getElementById('mLabel').textContent=selMonth.replace('-','.');
  if(curView==='home')renderHome();
  if(curView==='list')renderList();
  if(curView==='stat')renderStat();
  if(curView==='budget')renderBudget();
  if(curView==='set')renderSet();
}
function renderHome(){
  document.getElementById('totalAssets').textContent=won(totalAssets());
  document.getElementById('mInc').textContent=won(sumType(selMonth,'수입'));
  document.getElementById('mExp').textContent=won(sumType(selMonth,'지출'));

function txMeta(t){
  let sub='',cls='a-tr',sign='';
  if(t.type==='지출'){cls='a-exp';sign='-';sub=(t.cat?cat(t.cat)?.name:'')+' · '+(t.from?acc(t.from)?.name:'');}
  else if(t.type==='수입'){cls='a-inc';sign='+';sub=(t.cat?cat(t.cat)?.name:'')+' · '+(t.to?acc(t.to)?.name:'');}
  else{sub=(t.from?acc(t.from)?.name:'')+' → '+(t.to?acc(t.to)?.name:'');}
  if(t.fx)sub+=' · '+esc(t.fx);
  return {title:esc(t.memo||(t.type==='이체'?'이체':(t.cat?cat(t.cat)?.name:t.type))),sub:esc(sub),cls,sign};
}
function txRow(t){const m=txMeta(t);
  return `<div class="tx" onclick="openTx('${t.id}')"><div style="min-width:0"><div class="li">${m.title}</div>
    <div class="sub">${m.sub}</div></div><div class="amt ${m.cls}">${m.sign}${won(t.amount)}</div></div>`;
}
function reorderRow(t,isFirst,isLast){const m=txMeta(t);
  return `<div class="tx"><div style="display:flex;flex-direction:column;gap:2px;margin-right:10px">
    <button class="ordbtn" ${isFirst?'disabled':''} onclick="moveTx('${t.id}',-1)">▲</button>
    <button class="ordbtn" ${isLast?'disabled':''} onclick="moveTx('${t.id}',1)">▼</button></div>
    <div style="flex:1;min-width:0"><div class="li">${m.title}</div><div class="sub">${m.sub}</div></div>
    <div class="amt ${m.cls}">${m.sign}${won(t.amount)}</div></div>`;
}
function toggleReorder(){reorderMode=!reorderMode;renderList()}
function moveTx(id,dir){
  const t=db.transactions.find(x=>x.id===id);if(!t)return;
  const day=db.transactions.filter(x=>x.date===t.date).sort((a,b)=>(b.ord||0)-(a.ord||0));
  const i=day.findIndex(x=>x.id===id),j=i+dir;
  if(j<0||j>=day.length)return;
  const other=day[j],tmp=t.ord;t.ord=other.ord;other.ord=tmp;
  save();renderList();
}
function renderList(){
  const body=document.getElementById('listBody');
  const summary=document.getElementById('searchSummary');
  const clearBtn=document.getElementById('searchClear');
  const mn=document.getElementById('monthNav');
  const searching=!!searchQuery||!!searchFrom||!!searchTo;
  if(clearBtn)clearBtn.style.display=searching?'block':'none';
  if(mn)mn.style.visibility=searching?'hidden':'visible';
  let tx;
  if(searching){
    const q=searchQuery.toLowerCase();
    const num=searchQuery.replace(/[^0-9]/g,'');
    tx=db.transactions.filter(t=>{
      if(searchFrom&&t.date<searchFrom)return false;
      if(searchTo&&t.date>searchTo)return false;
      if(!q)return true;
      const hay=[t.memo,t.fx,t.inst,t.cat?cat(t.cat)?.name:'',t.from?acc(t.from)?.name:'',t.to?acc(t.to)?.name:'',t.type].join(' ').toLowerCase();
      if(hay.includes(q))return true;
      if(num&&String(t.amount).includes(num))return true;
      return false;
    }).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
    const exp=tx.filter(t=>t.type==='지출').reduce((s,t)=>s+t.amount,0);
    const rangeLbl=(searchFrom||searchTo)?`${searchFrom||'처음'}~${searchTo||'오늘'} · `:'';
    summary.style.display='block';
    summary.textContent=tx.length?`${rangeLbl}${tx.length}건 · 지출합계 ${won(exp)}`:`${rangeLbl}결과 없음`;
  }else{
    summary.style.display='none';summary.textContent='';
    tx=monthTx(selMonth).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  }
  if(!tx.length){body.innerHTML=searching?'<div class="empty">검색 결과가 없어요.</div>':'<div class="empty">이 달의 거래가 없어요.<br>아래 ＋ 버튼으로 추가하세요.</div>';return}
  const byDay={};tx.forEach(t=>{(byDay[t.date]=byDay[t.date]||[]).push(t)});
  let h='';
  if(!searching){
    h+=`<div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:0 2px 8px">
      ${reorderMode?'<span class="mut" style="margin:0 auto 0 2px">▲▼로 순서 조정 (같은 날짜 내)</span>':''}
      <button class="btn ghost" style="width:auto;padding:6px 10px;font-size:13px" onclick="toggleReorder()">${reorderMode?'✓ 완료':'↕ 순서 편집'}</button></div>`;
  }
  Object.keys(byDay).sort((a,b)=>b.localeCompare(a)).forEach(d=>{
    const items=byDay[d].slice().sort((a,b)=>(b.ord||0)-(a.ord||0));
    const dexp=items.filter(t=>t.type==='지출').reduce((s,t)=>s+t.amount,0);
    h+=`<div class="daygroup"><div class="dayhead"><span>${searching?fmtDayFull(d):fmtDay(d)}</span><span>지출 ${won(dexp)}</span></div>`;
    items.forEach((t,idx)=>{h+=(reorderMode&&!searching)?reorderRow(t,idx===0,idx===items.length-1):txRow(t)});
    h+='</div>';
  });
  body.innerHTML=h;
}
function onSearch(v){searchQuery=v.trim();renderList()}
function clearSearch(){searchQuery='';searchFrom='';searchTo='';
  const b=document.getElementById('searchBox');if(b)b.value='';

  const tt=document.getElementById('toDate');if(tt)tt.value='';

function isoMonthsAgo(n){const d=new Date();d.setMonth(d.getMonth()-n);return d.toISOString().slice(0,10)}
function setPeriod(p){
  const to=iso(0);
  if(p==='all'){searchFrom='';searchTo='';}
  else if(p==='year'){searchFrom=new Date().getFullYear()+'-01-01';searchTo=to;}
  else{searchFrom=isoMonthsAgo({'1m':1,'3m':3,'6m':6}[p]);searchTo=to;}

  const tt=document.getElementById('toDate');if(tt)tt.value=searchTo;

let pieChart,barChart;

    `<div class="li"><span><span class="dot" style="background:${palette[i%palette.length]}"></span>${esc(e[0])}</span><span>${won(e[1])} · ${tot?Math.round(e[1]/tot*100):0}%</span></div>`).join(''):'<div class="empty">지출 내역이 없어요.</div>';

function renderBudget(){
  const cats=db.categories.filter(c=>c.kind==='지출').sort((a,b)=>a.sort-b.sort);

      <div class="info"><span class="pct">${Math.round(s/c.budget*100)}%</span><span>${over?'초과 '+won(s-c.budget):'남음 '+won(c.budget-s)}</span></div></div>`;

function esc(s){return(s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDay(d){const[y,m,dd]=d.split('-');const w=['일','월','화','수','목','금','토'][new Date(d).getDay()];return`${Number(m)}월 ${Number(dd)}일 (${w})`}
function fmtDayFull(d){const[y,m,dd]=d.split('-');const w=['일','월','화','수','목','금','토'][new Date(d).getDay()];return`${y}.${Number(m)}.${Number(dd)} (${w})`}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600)}

function setTxType(type,t){
  txType=type;
  document.querySelectorAll('#segType button').forEach(b=>b.classList.toggle('on',b.dataset.t===type));
  const dyn=document.getElementById('f_dynamic');
  const st=db.settings||(db.settings={});
  const exists=id=>id&&db.accounts.some(a=>a.id===id);
  const defFrom = t ? t.from : (exists(st.lastFrom)?st.lastFrom:null);
  let defTo = t ? t.to : (exists(st.lastTo)?st.lastTo:null);
  const accOpts=(sel)=>db.accounts.slice().sort((a,b)=>a.sort-b.sort).map(a=>`<option value="${a.id}" ${sel===a.id?'selected':''}>${esc(a.name)}</option>`).join('');
  const catOpts=(kind,sel)=>db.categories.filter(c=>c.kind===kind).sort((a,b)=>a.sort-b.sort).map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  if(type==='지출'){
    dyn.innerHTML=`<div class="fld"><label>카테고리</label><select id="f_cat">${catOpts('지출',t?.cat)}</select></div>
      <div class="fld"><label>결제 수단 (출금계좌)</label><select id="f_from">${accOpts(defFrom)}</select></div>`;
  }else if(type==='수입'){
    dyn.innerHTML=`<div class="fld"><label>카테고리</label><select id="f_cat">${catOpts('수입',t?.cat)}</select></div>
      <div class="fld"><label>입금 계좌</label><select id="f_to">${accOpts(defTo)}</select></div>`;
  }else{
    if(!t&&defTo===defFrom)defTo=null;
    dyn.innerHTML=`<div class="two"><div class="fld"><label>보내는 계좌</label><select id="f_from">${accOpts(defFrom)}</select></div>
      <div class="fld"><label>받는 계좌</label><select id="f_to">${accOpts(defTo)}</select></div></div>
      <div class="fld"><label>분류 (선택)</label><select id="f_cat"><option value="">-</option>${catOpts('이체',t?.cat)}</select></div>
      <p class="mut">💡 이체는 자산 이동이라 총자산은 변하지 않아요. 카드 상환도 이걸로 하세요(받는 계좌=신용카드).</p>`;

}
function val(id){const e=document.getElementById(id);return e?e.value:''}
function fmtAmount(el){const v=el.value.replace(/[^0-9]/g,'');el.value=v?Number(v).toLocaleString('ko-KR'):''}
function saveTx(id){
  const amount=Math.round(Number(String(val('f_amount')).replace(/[^0-9.-]/g,'')));
  if(!amount||amount<=0){toast('금액을 입력하세요');return}
  const date=val('f_date')||iso(0);
  const rec={type:txType,amount,date,memo:val('f_memo').trim(),fx:txType!=='이체'?val('f_fx').trim():'',inst:txType==='지출'?val('f_inst').trim():'',
    cat:val('f_cat')||null,from:null,to:null};
  if(txType==='지출'){rec.from=val('f_from')}
  else if(txType==='수입'){rec.to=val('f_to')}
  else{rec.from=val('f_from');rec.to=val('f_to');if(rec.from===rec.to){toast('다른 계좌를 선택하세요');return}}
  if(id){const t=db.transactions.find(x=>x.id===id);Object.assign(t,rec)}
  else{rec.id=uid();rec.ord=nextOrd();db.transactions.push(rec)}
  db.settings=db.settings||{};
  if(rec.from)db.settings.lastFrom=rec.from;
  if(rec.to)db.settings.lastTo=rec.to;
  save();closeModal();render();toast(id?'수정했어요':'저장했어요');
}
function delTx(id){db.transactions=db.transactions.filter(t=>t.id!==id);save();closeModal();render();toast('삭제했어요')}
function openSettle(cardId){

}

function delAcc(id){
  const used=db.transactions.some(t=>t.from===id||t.to===id);
  if(used){if(!confirm('이 계좌를 사용하는 거래가 있어요. 그래도 삭제할까요? (거래는 남지만 계좌가 비게 됩니다)'))return}
  db.accounts=db.accounts.filter(a=>a.id!==id);save();closeModal();render();openManageAcc();toast('삭제했어요');
}
function openManageCat(){
  let h='<h3>카테고리 관리</h3>';
  ['지출','수입','이체'].forEach(k=>{h+=`<div class="sec-title">${k}</div>`;
    db.categories.filter(c=>c.kind===k).sort((a,b)=>a.sort-b.sort).forEach(c=>{h+=`<div class="set-item" onclick="openCatEdit('${c.id}')"><span>${esc(c.name)}</span><span class="r">${c.budget>0?won(c.budget):''} ›</span></div>`})});
  h+='<button class="btn sec" style="margin-top:12px" onclick="openCatEdit()">+ 카테고리 추가</button>';
  modal(h);
}
function openCatEdit(id){
  const c=id?cat(id):null;const kinds=['지출','수입','이체'];
  modal(`<h3>${c?'카테고리 수정':'카테고리 추가'}</h3>
    <div class="fld"><label>이름</label><input id="c_name" value="${c?esc(c.name):''}"></div>
    <div class="fld"><label>종류</label><select id="c_kind">${kinds.map(k=>`<option ${c&&c.kind===k?'selected':''}>${k}</option>`).join('')}</select></div>
    <div class="fld"><label>월 예산 (지출 카테고리, 선택)</label><input id="c_bud" inputmode="numeric" value="${c&&c.budget?c.budget:''}" placeholder="0"></div>
    <button class="btn" onclick="saveCat('${c?c.id:''}')">저장</button>
    ${c?`<button class="btn danger" onclick="delCat('${c.id}')">삭제</button>`:''}`);
}
function saveCat(id){
  const name=val('c_name').trim();if(!name){toast('이름을 입력하세요');return}
  const rec={name,kind:val('c_kind'),budget:Math.round(Number(String(val('c_bud')).replace(/[^0-9.-]/g,''))||0)};
  if(id){Object.assign(cat(id),rec)}else{rec.id=uid();rec.sort=db.categories.length;db.categories.push(rec)}
  save();closeModal();openManageCat();toast('저장했어요');render();
}
function delCat(id){db.categories=db.categories.filter(c=>c.id!==id);save();closeModal();openManageCat();toast('삭제했어요');render()}
function openBudgetEdit(){openManageCat()}

/* ---------- 백업 ---------- */
function exportXlsx(){
  const nm=id=>id?(acc(id)?.name||''):'';const cn=id=>id?(cat(id)?.name||''):'';
  const txRows=db.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>({
    날짜:t.date,구분:t.type,금액:t.amount,카테고리:cn(t.cat),출금계좌:nm(t.from),입금계좌:nm(t.to),'비고(외화)':t.fx||'',할부:t.inst||'',메모:t.memo||''}));
  const accRows=db.accounts.map(a=>({계좌명:a.name,은행:a.bank,유형:a.type,초기잔액:a.initial,통화:a.currency,카드결제일:a.payDay||'',현재잔액:accBalance(a.id)}));
  const catRows=db.categories.map(c=>({카테고리:c.name,종류:c.kind,월예산:c.budget||''}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(txRows),'거래');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(accRows),'계좌');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(catRows),'카테고리');
  XLSX.writeFile(wb,`가계부_${stamp()}.xlsx`);
  toast('엑셀로 내보냈어요');
}
function importXlsx(file){
  if(!file)return;const r=new FileReader();
  r.onload=e=>{try{
    const wb=XLSX.read(e.target.result,{type:'binary'});
    const sh=wb.Sheets['거래']||wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(sh);
    const accByName=n=>db.accounts.find(a=>a.name===String(n).trim());
    const catByName=n=>db.categories.find(c=>c.name===String(n).trim());
    let added=0;
    rows.forEach(row=>{
      const amount=Math.round(Number(String(row['금액']).replace(/[^0-9.-]/g,'')));
      if(!amount)return;
      const type=row['구분']||'지출';
      const t={id:uid(),date:String(row['날짜']).slice(0,10),type,amount,
        cat:catByName(row['카테고리'])?.id||null,from:accByName(row['출금계좌'])?.id||null,to:accByName(row['입금계좌'])?.id||null,
        fx:row['비고(외화)']||'',inst:row['할부']||'',memo:row['메모']||''};
      db.transactions.push(t);added++;
    });
    save();render();toast(added+'건 가져왔어요');
  }catch(err){toast('가져오기 실패: 형식을 확인하세요')}};
  r.readAsBinaryString(file);
  document.getElementById('impXlsx').value='';
}
function exportJson(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`가계부백업_${stamp()}.json`;a.click();
  toast('백업 파일을 저장했어요');
}
function importJson(file){
  if(!file)return;const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);
    if(!d.accounts||!d.transactions)throw 0;
    if(!confirm('현재 데이터를 백업 파일로 덮어쓸까요?'))return;
    db=d;save();render();toast('복원했어요');
  }catch(err){toast('복원 실패: 올바른 백업 파일이 아니에요')}};
  r.readAsText(file);document.getElementById('impJson').value='';
}
function wipeExamples(){
  const before=db.transactions.length;
  db.transactions=db.transactions.filter(t=>!(t.memo||'').startsWith('[예시]'));
  save();render();toast((before-db.transactions.length)+'건 지웠어요');
}
function resetAll(){if(confirm('모든 데이터를 지우고 처음 상태로 되돌릴까요?')){localStorage.removeItem(DB_KEY);load();render();toast('초기화했어요')}}

/* ---------- 시작 ---------- */
load();go('home');
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
